<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>미결함</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Myeongjo:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <button class="tb" id="menuBtn" aria-label="사건함 열기">사건함</button>
        <div class="logo"><i></i>미결함</div>
        <div class="sp"></div>
        <button class="tb ai" id="aiBtn" title="AI 대화 켜기/끄기">
          <b></b><span id="aiTxt">AI 확인 중</span>
        </button>
        <button class="tb" id="diffBtn" title="난이도">
          <span class="dl">난이도 </span><span id="diffTxt"></span>
        </button>
        <button class="tb" id="fsBtn" title="글자 크기">가<small id="fsTxt"></small></button>
        <button class="tb" id="hideBtn" title="Esc 두 번으로도 전환">업무 화면</button>
      </header>
      <div class="body">
        <nav class="side" id="side" aria-label="사건함"></nav>
        <main class="main">
          <div class="head">
            <div>
              <h1 id="cTitle"></h1>
              <p id="cSum"></p>
            </div>
            <div class="sp"></div>
            <button class="tb" id="noteBtn">수첩</button>
          </div>
          <div class="ppl" id="ppl" role="tablist"></div>
          <div class="log" id="log" aria-live="polite"></div>
          <div>
            <div class="tray" id="tray" aria-label="질문 카드"></div>
            <form class="inp" id="form">
              <textarea
                id="q"
                rows="1"
                placeholder="질문을 입력하세요 (Enter 전송)"
                aria-label="질문"
              ></textarea>
              <button class="send" id="sendBtn" type="submit">보내기</button>
            </form>
          </div>
        </main>
        <aside class="note" id="note" aria-label="수첩">
          <div class="nh">
            <h2>수첩</h2>
            <span id="prog"></span>
          </div>
          <div class="nl" id="nl"></div>
          <div class="nf">
            <button class="rep" id="repBtn">결재 올리기</button>
            <div class="sm">
              <span id="tries"></span><button id="resetBtn">이 사건 처음부터</button>
            </div>
          </div>
        </aside>
      </div>
    </div>
    <div class="scrim" id="scrim"></div>
    <div class="ov" id="ov"><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
    <div id="memo" aria-hidden="true">
      <div class="mh">
        <h1>11월 4주차 업무 메모</h1>
        <button id="memoClose" title="Esc 두 번으로도 돌아갈 수 있어요">닫기</button>
      </div>
      <div class="mt">마지막 수정 오늘 · 개인 메모</div>
      <textarea id="memoTxt" spellcheck="false">
■ 이번 주 할 일
- 12월 운영 계획안 초안 정리 (목요일까지)
- 협력사 견적 비교표 업데이트: 단가 변동분 반영
- 주간 회의 안건 취합 → 금요일 오전 공유
- 출장비 정산 영수증 스캔

■ 회의 메모 (화)
- 일정 1주 지연 가능성, 리소스 재배치 검토
- 다음 주 화요일 재논의

■ 확인 필요
- 연말 재고 실사 일정
- 신규 입사자 계정 발급 요청 상태</textarea
      >
    </div>
    <script src="script.js"></script>
  </body>
</html>
